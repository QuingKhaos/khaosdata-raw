name: Extract

on:
  schedule:
    - cron: '42 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch Extraction
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [stable, experimental]
        configuration:
          - vanilla
          - space-age

    steps:
      - name: Dispatch extraction workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: extract.yml
          ref: ${{ matrix.version}}/${{ matrix.configuration }}
